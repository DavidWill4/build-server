name: 专属云端交互式构建服务器

on:
  workflow_dispatch:
    inputs:
      os:
        description: '💻 操作系统环境选择'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      toolchain:
        description: '🛠️ 预装开发工具链'
        required: true
        default: 'rust-and-node'
        type: choice
        options:
          - rust-and-node
          - node-only
          - rust-only
          - minimal

concurrency:
  group: interactive-build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 云端构建机 (${{ github.event.inputs.os || 'windows-latest' }})
    runs-on: ${{ github.event.inputs.os || 'windows-latest' }}

    steps:
      - name: 配置 Node.js 开发环境
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'node-only'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: 配置 Rust 编译工具链
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'rust-only'
        uses: dtolnay/rust-toolchain@stable

      # ----------------------------------------------------
      # Windows 云端服务器部署引擎
      # ----------------------------------------------------
      - name: 启动 Windows 原生 OpenSSH 云端机与安全隧道
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 生成 16 位强随机高熵密码并设置 runneradmin 密码
          $chars = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*'
          $rand = New-Object System.Random
          $randomPass = "Vrcx@" + (-join ((1..12) | ForEach-Object { $chars[$rand.Next(0, $chars.Length)] }))
          net.exe user runneradmin $randomPass | Out-Null

          # 2. 启动 Windows 原生 OpenSSH 服务
          Start-Service sshd | Out-Null
          Set-Service -Name sshd -StartupType 'Automatic' | Out-Null

          # 3. 配置授权公钥与双认证模式（密钥 + 密码均可登录）
          $keys = $env:SSH_KEY.Trim()
          $authFile = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $authFile -Value $keys -Encoding ascii

          $userSshDir = "C:\Users\runneradmin\.ssh"
          if (-not (Test-Path $userSshDir)) { New-Item -ItemType Directory -Path $userSshDir -Force | Out-Null }
          Set-Content -Path "$userSshDir\authorized_keys" -Value $keys -Encoding ascii

          icacls.exe $authFile /inheritance:r /grant "SYSTEM:F" /grant "Administrators:F" /grant "runneradmin:F" | Out-Null
          icacls.exe "$userSshDir\authorized_keys" /inheritance:r /grant "SYSTEM:F" /grant "Administrators:F" /grant "runneradmin:F" | Out-Null

          $sshdConfig = "C:\ProgramData\ssh\sshd_config"
          if (Test-Path $sshdConfig) {
              $conf = Get-Content $sshdConfig -Raw
              $conf = $conf -replace '#?PubkeyAuthentication.*', 'PubkeyAuthentication yes'
              $conf = $conf -replace '#?PasswordAuthentication.*', 'PasswordAuthentication yes'
              $conf = $conf -replace '#?StrictModes.*', 'StrictModes no'
              Set-Content -Path $sshdConfig -Value $conf
          }
          Restart-Service sshd | Out-Null

          # 4. 下载并启动 cloudflared TCP 加密隧道（完全静音）
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe" | Out-Null
          $logPath = "C:\cloudflared.log"
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:22 --logfile $logPath" -WindowStyle Hidden

          # 5. 获取隧道专属动态域名
          $domain = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $logPath) {
              $content = Get-Content $logPath -Raw
              if ($content -match 'https://([a-zA-Z0-9-]+\.trycloudflare\.com)') {
                $domain = $matches[1]
                break
              }
            }
          }

          # 6. 发送中文 Telegram 专属私密通知
          $sshCmd = "ssh -o ProxyCommand=`"cloudflared access tcp --hostname %h`" runneradmin@$domain"
          $lines = @(
            "🚀 <b>专属云端 Windows 编译机已就绪</b>",
            "",
            "💻 <b>系统环境：</b> Windows Server (x86_64)",
            "⏱️ <b>有效时长：</b> 6 小时（断开或手动退出后自动物理销毁）",
            "",
            "🔑 <b>SSH 终端快捷连接指令：</b>",
            "<code>$sshCmd</code>",
            "",
            "🔐 <b>登录密码（点击复制）：</b>",
            "<code>$randomPass</code>",
            "",
            "🛡️ <b>双重认证支持：</b>",
            "• 本地 SSH 私钥免密直连",
            "• 临时密码输入登录（二者任选其一均可）",
            "",
            "🌐 <b>隧道专属域名：</b>",
            "<code>$domain</code>",
            "",
            "💡 <i>提示：构建完毕在终端输入 exit 即可立即物理销毁服务器。</i>"
          )
          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = ($lines -join "`n")
            parse_mode = "HTML"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Method Post -Body $body -ContentType "application/json; charset=utf-8" | Out-Null

          # 7. 控制台全流程脱敏输出
          Write-Host "============================================================"
          Write-Host "🔒 专属云端交互式编译服务器正在运行"
          Write-Host "📨 所有连接凭证、专属域名与临时密码已通过专属加密信道推送至您的 Telegram。"
          Write-Host "🛡️ 网页端日志全程脱敏，任务结束后将自动物理销毁所有运行记录。"
          Write-Host "============================================================"

          # 8. 保持运行（最长 6 小时，支持信号提前退出）
          for ($t = 0; $t -lt 21600; $t += 5) {
            if (Test-Path "C:\stop") { break }
            Start-Sleep -Seconds 5
          }

      # ----------------------------------------------------
      # Linux 云端服务器部署引擎
      # ----------------------------------------------------
      - name: 启动 Linux 云端机与安全隧道
        if: runner.os == 'Linux'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 生成 16 位强随机密码
          RANDOM_PASS="Vrcx@$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 12)"
          echo "runner:$RANDOM_PASS" | sudo chpasswd
          echo "root:$RANDOM_PASS" | sudo chpasswd

          sudo apt-get update -y > /dev/null 2>&1 && sudo apt-get install -y tmate > /dev/null 2>&1
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          cat << 'EOF' > ~/.tmate.conf
          set -g tmate-authorized-keys "~/.ssh/authorized_keys"
          EOF

          SOCKET="/tmp/tmate.sock"
          tmate -S "$SOCKET" -F new-session -d > /dev/null 2>&1 || tmate -S "$SOCKET" new-session -d > /dev/null 2>&1
          tmate -S "$SOCKET" wait tmate-ready
          SSH_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_ssh}')
          WEB_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_web}')

          MSG="🚀 <b>专属云端 Linux 编译机已就绪</b>%0A%0A💻 <b>系统环境：</b> Ubuntu Linux (x86_64)%0A⏱️ <b>有效时长：</b> 6 小时%0A%0A🔑 <b>SSH 快捷连接指令：</b>%0A<code>${SSH_CMD}</code>%0A%0A🔐 <b>登录临时密码：</b>%0A<code>${RANDOM_PASS}</code>%0A%0A🌐 <b>Web 终端连接：</b>%0A${WEB_CMD}%0A%0A💡 <i>提示：构建完毕在终端输入 exit 即可立即物理销毁服务器。</i>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null 2>&1 || true

          echo "============================================================"
          echo "🔒 Linux 专属云端交互式编译服务器正在运行"
          echo "📨 所有连接凭证已通过专属加密信道推送至您的 Telegram。"
          echo "🛡️ 网页端日志全程脱敏，任务结束后将自动物理销毁所有运行记录。"
          echo "============================================================"

          while pgrep -f tmate > /dev/null 2>&1; do
            sleep 10
          done

      # ----------------------------------------------------
      # 用完即销毁：自动抹除本次工作流的所有记录与日志
      # ----------------------------------------------------
      - name: 阅后即焚：物理抹除本次运行记录与所有日志
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null 2>&1 || true
