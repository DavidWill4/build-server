name: Interactive Cloud Build Server

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      toolchain:
        description: 'Pre-installed Developer Toolchain'
        required: true
        default: 'rust-and-node'
        type: choice
        options:
          - rust-and-node
          - node-only
          - rust-only
          - minimal

concurrency:
  group: interactive-build-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Cloud Server (${{ github.event.inputs.os || 'windows-latest' }})
    runs-on: ${{ github.event.inputs.os || 'windows-latest' }}

    steps:
      - name: Setup Node.js
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'node-only'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Rust toolchain
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'rust-only'
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmate (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed libevent libssh msgpack-c tmate

      - name: Install tmate (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y tmate

      - name: Launch Secure SSH Server & Notify Telegram
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys || true

          # 配置 tmate 仅允许授权 SSH 公钥登录
          cat << 'EOF' > ~/.tmate.conf
          set -g tmate-authorized-keys "~/.ssh/authorized_keys"
          EOF

          if [ "$RUNNER_OS" = "Windows" ]; then
            cp ~/.tmate.conf /home/runneradmin/.tmate.conf 2>/dev/null || true
            cp ~/.ssh/authorized_keys /home/runneradmin/.ssh/authorized_keys 2>/dev/null || true
            SOCKET="C:/msys64/tmp/tmate.sock"
            C:/msys64/usr/bin/tmate.exe -S "$SOCKET" -F new-session -d || C:/msys64/usr/bin/tmate.exe -S "$SOCKET" new-session -d
            C:/msys64/usr/bin/tmate.exe -S "$SOCKET" wait tmate-ready
            SSH_CMD=$(C:/msys64/usr/bin/tmate.exe -S "$SOCKET" display -p '#{tmate_ssh}')
            WEB_CMD=$(C:/msys64/usr/bin/tmate.exe -S "$SOCKET" display -p '#{tmate_web}')
          else
            SOCKET="/tmp/tmate.sock"
            tmate -S "$SOCKET" -F new-session -d || tmate -S "$SOCKET" new-session -d
            tmate -S "$SOCKET" wait tmate-ready
            SSH_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_ssh}')
            WEB_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_web}')
          fi

          echo "============================================================"
          echo "🔒 Interactive Cloud Build Server is LIVE & READY!"
          echo "📨 Sending SSH credentials directly to Telegram..."
          echo "============================================================"

          MSG="🚀 <b>Cloud Build Server Online!</b>%0A💻 <b>OS:</b> ${RUNNER_OS}%0A🔒 <b>Auth:</b> SSH Public Key Authentication%0A🔑 <b>SSH Command:</b>%0A<code>${SSH_CMD}</code>%0A🌐 <b>Web Terminal:</b>%0A${WEB_CMD}%0A⏱️ <b>Max Session:</b> 6 Hours"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true

          echo "✅ Credentials sent successfully to your Telegram!"
          echo "🛡️ Access restricted strictly to your authorized SSH key."

          if [ "$RUNNER_OS" = "Windows" ]; then
            while C:/msys64/usr/bin/ps.exe -ef | grep -v grep | grep -q tmate; do
              sleep 10
            done
          else
            while pgrep -f tmate > /dev/null 2>&1; do
              sleep 10
            done
          fi
