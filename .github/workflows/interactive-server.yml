name: Interactive Cloud Build Server

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      toolchain:
        description: 'Pre-installed Developer Toolchain'
        required: true
        default: 'rust-and-node'
        type: choice
        options:
          - rust-and-node
          - node-only
          - rust-only
          - minimal

concurrency:
  group: interactive-build-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Cloud Server (${{ github.event.inputs.os || 'windows-latest' }})
    runs-on: ${{ github.event.inputs.os || 'windows-latest' }}

    steps:
      - name: Setup Node.js
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'node-only'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Rust toolchain
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'rust-only'
        uses: dtolnay/rust-toolchain@stable

      - name: Start Background SSH Server (Key Locked)
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          authorized-keys: ${{ secrets.SSH_PUBLIC_KEY }}
          detached: true

      - name: Send Private Notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          # 查找 tmate socket
          SOCKET=""
          for s in "/tmp/tmate.sock" "C:/msys64/tmp/tmate.sock" "/var/tmp/tmate.sock"; do
            if [ -S "$s" ]; then
              SOCKET="$s"
              break
            fi
          done

          # 获取连接字符串
          SSH_CMD=""
          WEB_CMD=""
          if [ -n "$SOCKET" ]; then
            SSH_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_ssh}' 2>/dev/null || true)
            WEB_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_web}' 2>/dev/null || true)
          fi

          if [ -z "$SSH_CMD" ]; then
            # 尝试通过环境变量或 ps 查找
            SSH_CMD="Please check tmate socket or connect with your authorized SSH key"
          fi

          # 构建 Telegram 消息
          MSG="🚀 <b>Cloud Build Server Online!</b>%0A💻 <b>OS:</b> ${RUNNER_OS}%0A🔒 <b>Auth:</b> SSH Public Key Authentication%0A🔑 <b>SSH Command:</b>%0A<code>${SSH_CMD}</code>%0A🌐 <b>Web Terminal:</b>%0A${WEB_CMD}%0A⏱️ <b>Max Session:</b> 6 Hours"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true

          echo "============================================================"
          echo "🔒 Interactive Cloud Build Server is LIVE & READY!"
          echo "📨 SSH connection command has been sent to your Telegram."
          echo "🛡️ Only your authorized SSH private key can establish connection."
          echo "============================================================"

      - name: Keep Server Alive (Wait for Exit)
        shell: bash
        run: |
          echo "Server running. To terminate, type 'exit' or disconnect tmate."
          while pgrep -f tmate > /dev/null 2>&1 || ps -ef | grep -v grep | grep -q tmate; do
            sleep 10
          done
