name: Interactive Cloud Build Server

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      toolchain:
        description: 'Pre-installed Developer Toolchain'
        required: true
        default: 'rust-and-node'
        type: choice
        options:
          - rust-and-node
          - node-only
          - rust-only
          - minimal

concurrency:
  group: interactive-build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Cloud Server (${{ github.event.inputs.os || 'windows-latest' }})
    runs-on: ${{ github.event.inputs.os || 'windows-latest' }}

    steps:
      - name: Setup Node.js
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'node-only'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Rust toolchain
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'rust-only'
        uses: dtolnay/rust-toolchain@stable

      - name: Launch Interactive SSH Server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y tmate
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          cat << 'EOF' > ~/.tmate.conf
          set -g tmate-authorized-keys "~/.ssh/authorized_keys"
          EOF

          SOCKET="/tmp/tmate.sock"
          tmate -S "$SOCKET" -F new-session -d || tmate -S "$SOCKET" new-session -d
          tmate -S "$SOCKET" wait tmate-ready
          SSH_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_ssh}')
          WEB_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_web}')

          MSG="🚀 <b>Cloud Linux Server Online!</b>%0A💻 <b>OS:</b> Ubuntu Linux%0A🔒 <b>Auth:</b> SSH Public Key Authentication%0A🔑 <b>SSH Command:</b>%0A<code>${SSH_CMD}</code>%0A🌐 <b>Web Terminal:</b>%0A${WEB_CMD}%0A⏱️ <b>Max Session:</b> 6 Hours"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true

          echo "============================================================"
          echo "🔒 Linux Cloud Build Server is LIVE & READY!"
          echo "📨 SSH credentials sent directly to your Telegram."
          echo "🛡️ Access restricted strictly to your authorized SSH key."
          echo "============================================================"

          while pgrep -f tmate > /dev/null 2>&1; do
            sleep 10
          done

      - name: Launch Interactive SSH Server (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 启动 Windows 原生 OpenSSH 服务并锁定公钥
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          $authFile = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $authFile -Value $env:SSH_KEY -Encoding ascii
          icacls.exe $authFile /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null

          # 2. 下载并启动 cloudflared TCP 隧道
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"
          $logPath = "C:\cloudflared.log"
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:22 --logfile $logPath" -WindowStyle Hidden

          # 3. 等待隧道域名生成
          $domain = ""
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path $logPath) {
              $content = Get-Content $logPath -Raw
              if ($content -match 'https://([a-zA-Z0-9-]+\.trycloudflare\.com)') {
                $domain = $matches[1]
                break
              }
            }
          }

          # 4. 构建并推送 Telegram 通知
          $lines = @(
            "🚀 <b>Cloud Windows Server Online!</b>",
            "💻 <b>OS:</b> Windows Server (Native OpenSSH)",
            "🔒 <b>Auth:</b> SSH Public Key Authentication",
            "🔑 <b>SSH Command:</b>",
            "<code>ssh -o ProxyCommand='cloudflared access tcp --hostname %h' runneradmin@$domain</code>",
            "🌐 <b>Tunnel Domain:</b>",
            "<code>$domain</code>",
            "⏱️ <b>Max Session:</b> 6 Hours"
          )
          $text = $lines -join "`n"

          $body = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $text
            parse_mode = "HTML"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Method Post -Body $body -ContentType "application/json" | Out-Null

          Write-Host "============================================================"
          Write-Host "🔒 Windows Cloud Build Server is LIVE & READY!"
          Write-Host "📨 SSH connection command has been sent to your Telegram."
          Write-Host "🛡️ Access restricted strictly to your authorized SSH key."
          Write-Host "============================================================"

          # 5. 保持开机 6 小时
          Start-Sleep -Seconds 21600
