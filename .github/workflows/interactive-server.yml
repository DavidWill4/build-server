name: Interactive Cloud Build Server

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Target Operating System'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
      toolchain:
        description: 'Pre-installed Developer Toolchain'
        required: true
        default: 'rust-and-node'
        type: choice
        options:
          - rust-and-node
          - node-only
          - rust-only
          - minimal

concurrency:
  group: interactive-build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Cloud Server (${{ github.event.inputs.os || 'windows-latest' }})
    runs-on: ${{ github.event.inputs.os || 'windows-latest' }}

    steps:
      - name: Setup Node.js
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'node-only'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Rust toolchain
        if: github.event.inputs.toolchain == 'rust-and-node' || github.event.inputs.toolchain == 'rust-only'
        uses: dtolnay/rust-toolchain@stable

      - name: Launch Interactive SSH Server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y tmate
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          cat << 'EOF' > ~/.tmate.conf
          set -g tmate-authorized-keys "~/.ssh/authorized_keys"
          EOF

          SOCKET="/tmp/tmate.sock"
          tmate -S "$SOCKET" -F new-session -d || tmate -S "$SOCKET" new-session -d
          tmate -S "$SOCKET" wait tmate-ready
          SSH_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_ssh}')
          WEB_CMD=$(tmate -S "$SOCKET" display -p '#{tmate_web}')

          MSG="🚀 <b>Cloud Linux Server Online!</b>%0A💻 <b>OS:</b> Ubuntu Linux%0A🔒 <b>Auth:</b> SSH Public Key Authentication%0A🔑 <b>SSH Command:</b>%0A<code>${SSH_CMD}</code>%0A🌐 <b>Web Terminal:</b>%0A${WEB_CMD}%0A⏱️ <b>Max Session:</b> 6 Hours"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true

          echo "============================================================"
          echo "🔒 Linux Cloud Build Server is LIVE & READY!"
          echo "📨 SSH credentials sent directly to your Telegram."
          echo "🛡️ Access restricted strictly to your authorized SSH key."
          echo "============================================================"

          while pgrep -f tmate > /dev/null 2>&1; do
            sleep 10
          done

      - name: Launch Interactive SSH Server (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. 启动 Windows 原生 OpenSSH 服务并锁定公钥
          powershell -Command "Start-Service sshd; Set-Service -Name sshd -StartupType Automatic"
          mkdir -p "C:/ProgramData/ssh"
          echo "$SSH_KEY" > "C:/ProgramData/ssh/administrators_authorized_keys"
          powershell -Command "icacls.exe 'C:\ProgramData\ssh\administrators_authorized_keys' /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F'"

          # 2. 下载并启动 cloudflared TCP 隧道
          curl -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "C:/cloudflared.exe"
          chmod +x "C:/cloudflared.exe" || true

          "C:/cloudflared.exe" tunnel --url tcp://localhost:22 --logfile "C:/cloudflared.log" &

          # 3. 等待隧道域名生成
          DOMAIN=""
          for i in {1..30}; do
            sleep 2
            if [ -f "C:/cloudflared.log" ]; then
              DOMAIN=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' "C:/cloudflared.log" | head -n 1 | sed 's#https://##')
              if [ -n "$DOMAIN" ]; then
                break
              fi
            fi
          done

          # 4. 构建并推送 Telegram 通知
          SSH_CMD="ssh -o ProxyCommand='cloudflared access tcp --hostname %h' runneradmin@${DOMAIN}"
          MSG="🚀 <b>Cloud Windows Server Online!</b>%0A💻 <b>OS:</b> Windows Server (Native OpenSSH)%0A🔒 <b>Auth:</b> SSH Public Key Authentication%0A🔑 <b>SSH Command:</b>%0A<code>${SSH_CMD}</code>%0A🌐 <b>Tunnel Domain:</b>%0A<code>${DOMAIN}</code>%0A⏱️ <b>Max Session:</b> 6 Hours"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true

          echo "============================================================"
          echo "🔒 Windows Cloud Build Server is LIVE & READY!"
          echo "📨 SSH connection command has been sent to your Telegram."
          echo "🛡️ Access restricted strictly to your authorized SSH key."
          echo "============================================================"

          # 5. 保持开机 6 小时
          sleep 21600
